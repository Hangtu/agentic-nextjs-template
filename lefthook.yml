# Optional application-hook recipe, not installed in this docs-only kit.
# Merge only after approval; retain only configured checks (i18n/test may be absent).
# Never overwrite target hooks or use --no-verify to hide failures.

pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{js,mjs,cjs,ts,tsx,json,md,css,yml,yaml}"
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    lint:
      glob: "*.{js,mjs,cjs,ts,tsx}"
      run: pnpm exec eslint --cache --fix --max-warnings=0 {staged_files}
      stage_fixed: true
    i18n:
      glob: "messages/*.json"
      run: pnpm i18n:check

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    typecheck:
      run: pnpm typecheck
    test:
      run: pnpm test

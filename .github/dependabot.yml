# Grouped weekly updates with a cooldown: new releases wait a few days before PRs open (supply-chain safety, DEP-5).
# Security updates are not delayed by the cooldown.
version: 2
updates:
  - package-ecosystem: npm # works with pnpm-lock.yaml
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 14
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"

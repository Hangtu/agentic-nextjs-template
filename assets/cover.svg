<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="cover-title cover-desc">
  <title id="cover-title">Agentic Next.js Kit — Doctor, Adopt, Verify</title>
  <desc id="cover-desc">A dark technical banner reading Agentic Next.js Kit: inspect first, adopt deliberately, verify changes. Three connected stages show Doctor, Adopt and Verify next to a document inspection motif.</desc>
  <defs>
    <linearGradient id="cover-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07110f"/>
      <stop offset="0.55" stop-color="#0c1916"/>
      <stop offset="1" stop-color="#111d1a"/>
    </linearGradient>
    <radialGradient id="cover-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="cover-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#9beadf" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="cover-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#cover-bg)"/>
  <rect width="1280" height="640" fill="url(#cover-grid)"/>
  <ellipse cx="1050" cy="130" rx="380" ry="300" fill="url(#cover-glow)"/>
  <circle cx="1160" cy="570" r="210" fill="#5eead4" fill-opacity="0.04" filter="url(#cover-soft)"/>

  <g fill="none" stroke="#8be8d8">
    <path d="M64 88h18M64 88v18" stroke-opacity="0.5" stroke-width="1.5"/>
    <path d="M1216 552h-18M1216 552v-18" stroke-opacity="0.5" stroke-width="1.5"/>
  </g>

  <g transform="translate(80 72)">

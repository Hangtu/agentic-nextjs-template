    <path d="M14 14h10v10H14zM23 23h7v7h-7z" fill="#5eead4"/>
    <path d="M29 14h5v5h-5z" fill="#2dd4bf" fill-opacity="0.65"/>
  </g>
  <text x="140" y="102" fill="#d7f6ef" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="19" font-weight="600" letter-spacing="2.4">AGENTIC NEXT.JS KIT</text>

  <text x="80" y="238" fill="#f3fffc" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="72" font-weight="700" letter-spacing="-2.6">Inspect first.</text>
  <text x="80" y="318" fill="#f3fffc" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="72" font-weight="700" letter-spacing="-2.6">Adopt deliberately.</text>
  <text x="80" y="398" fill="#5eead4" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="72" font-weight="700" letter-spacing="-2.6">Verify changes.</text>

  <text x="84" y="456" fill="#9ebbb4" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22">Engineering standards for AI-assisted Next.js projects.</text>
  <text x="84" y="486" fill="#7a9c94" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">From a landing page to a product. No unnecessary SaaS layer.</text>

